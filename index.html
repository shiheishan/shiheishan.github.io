<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>作业清单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./assets/styles/theme/tokens.css" />
  <link rel="stylesheet" href="./assets/styles/base/base.css" />
  <link rel="stylesheet" href="./assets/styles/base/layout.css" />
  <link rel="stylesheet" href="./assets/styles/components/hw-panel.css" />
  <link rel="stylesheet" href="./assets/styles/components/done.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead__meta">
      <span id="dateMono">----.--.--</span>
      <span id="weekTime">--- --:--</span>
    </div>
    <div class="masthead__main">
      <div class="masthead__title">
        <h1>今日作业</h1>
        <div class="masthead__summary" id="summary"></div>
      </div>
      <div class="counter" id="counter" role="progressbar" aria-label="整体完成度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="counter__num" id="doneNum"></span>
        <span class="counter__total" id="total"></span>
      </div>
    </div>
  </header>

  <div class="ticks">
    <div class="ticks__inner" id="ticks"></div>
  </div>

  <main class="subjects" id="subjects"></main>

  <div class="done" id="done" role="dialog" aria-modal="true" aria-labelledby="doneTitle" hidden>
    <div class="done__card">
      <div class="done__stamp" aria-hidden="true">
        <div class="done__stamp-inner">
          <span class="done__stamp-text">完成</span>
        </div>
      </div>
      <h2 class="done__title" id="doneTitle">今日任务已完成</h2>
      <p class="done__text">请好好休息。</p>
      <button type="button" class="done__close" id="doneClose">返回</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
